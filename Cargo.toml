[package]
name = "rustypot"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Self-hosted exploit-path honeypot with sticky deception — traps credential stuffers, captures post-exploitation payloads"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }
governor = "0.8"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
